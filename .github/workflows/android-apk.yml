name: Android 安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 安装依赖并检查
        run: |
          npm ci
          npm test
          npx tsc --noEmit

      - name: 生成 Android 工程
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      # 首版产物供个人安装测试，使用 Expo 生成工程默认的调试签名；上架前需换成专用发布密钥。
      - name: 打包独立运行的 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-management-android-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
